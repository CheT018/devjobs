<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#06182a" />
    <title>DevJobs - Empleos para desarrolladores</title>
    <meta
      name="description"
      content="DevJobs es un portal de empleo para desarrolladores. Busca ofertas por tecnología, ubicación, modalidad y nivel de experiencia."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Antes de pintar, para no mostrar un destello del tema equivocado. Ver useTheme.ts -->
    <script>
      try {
        const stored = localStorage.getItem('devjobs-theme')
        const prefersLight = matchMedia('(prefers-color-scheme: light)').matches
        document.documentElement.dataset.theme =
          stored === 'light' || stored === 'dark' ? stored : prefersLight ? 'light' : 'dark'
      } catch {}
    </script>

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="DevJobs" />
    <meta property="og:locale" content="es_ES" />
    <meta property="og:url" content="https://devjobs-lilac.vercel.app/" />
    <meta property="og:title" content="DevJobs - Empleos para desarrolladores" />
    <meta
      property="og:description"
      content="Busca ofertas de desarrollo por tecnología, ubicación, modalidad y nivel. Guarda favoritos y sigue tus candidaturas."
    />
    <meta property="og:image" content="https://devjobs-lilac.vercel.app/og-image.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="DevJobs: encuentra el trabajo de tus sueños. Busca y filtra, guarda favoritos y sigue tus candidaturas."
    />
    <meta name="twitter:card" content="summary_large_image" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
