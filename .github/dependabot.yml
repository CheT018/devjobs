version: 2

updates:
  # Mantiene actualizados los SHA de las actions fijadas en los workflows
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: weekly
    # Espera unos días antes de proponer una versión recién publicada
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - '*'

  # Dependencias de todos los paquetes del monorepo (pnpm)
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch

  # Imágenes base de los Dockerfiles
  - package-ecosystem: docker
    directories:
      - /apps/api
      - /apps/web
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
