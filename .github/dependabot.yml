version: 2

updates:
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - '*'

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: docker
    directories:
      - /apps/api
      - /apps/web
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      # Nos quedamos en Node 24 (LTS). Node 25+ ya no incluye corepack,
      # que usan los Dockerfiles para activar pnpm.
      - dependency-name: node
        update-types:
          - version-update:semver-major
