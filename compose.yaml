# Levanta la aplicación completa: docker compose up --build
# La web queda en http://localhost:8080 y la API en http://localhost:8080/api

services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    volumes:
      - api-data:/data
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      API_URL: http://api:3000
    ports:
      - '8080:8080'
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  api-data:
